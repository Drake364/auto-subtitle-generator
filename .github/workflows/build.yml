name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Este passo vai listar os arquivos gerados após o build
      - name: Build with Gradle and list APK files
        run: |
          ./gradlew assembleDebug
          echo "--- Arquivos encontrados na pasta build ---"
          find . -name "*.apk" -type f

      # Este passo vai tentar subir o APK de qualquer lugar que ele esteja
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'
          if-no-files-found: warn
